
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>scavenger</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ALBUM NAVIGATION -->

    <div class="album-nav">

        <a href="index.html">&lt;&lt;&lt; back to the pile</a>

        <a href="#" class="reshuffle-box" onclick="randomCD(); return false;">
            shuffle
        </a>

    </div>


    <!-- INFORMATION -->

    <h2>information</h2>


    <div class="album-layout">

        <div class="album-left">

            <img
                id="album-image"
                class="album-photo"
                src=""
                alt=""
            >

            <p id="album-info"></p>

        </div>


        <!-- ALBUM NOTES -->

        <div class="album-notes">

            <h3>my notes:</h3>

            <p id="album-notes-text"></p>

            <p id="album-price"></p>

            <!-- MARKET VALUE FOR RARE CDS -->

            <p id="album-market-value" style="display: none;"></p>

            <p id="album-location"></p>

            <p id="album-date"></p>

            <p>
                favourite songs:<br>
                <span id="album-songs"></span>
            </p>

            <!-- FULL REVIEW -->

            <div id="review-container"></div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="cds.js"></script>
    <script src="script.js"></script>


    <script>

        /* FIND CURRENT ALBUM */

        const params =
            new URLSearchParams(window.location.search);

        const id =
            params.get("id");

        const album =
            cds.find(function(cd) {
                return cd.id === id;
            });


        if (album) {

            /* PAGE TITLE */

            document.title =
                album.artist + " - " + album.album;


            /* ALBUM IMAGE */

            document.getElementById("album-image").src =
                album.image;

            document.getElementById("album-image").alt =
                album.artist + " - " + album.album;


            /* ALBUM INFORMATION */

            document.getElementById("album-info").innerHTML =
                "artist: " + album.artist + "<br>" +
                "album: " + album.album + "<br>" +
                "year: " + (album.year ?? "not rated") + "<br>" +
                "genre: " + album.genre + "<br>" +
                "style: " + album.style + "<br><br>" +
                "my rating: " +
                (album.rating == null ? "not rated yet" : album.rating + "/10");


            /* PERSONAL NOTES */

            document.getElementById("album-notes-text").textContent =
                album.notes || "";


            /* PRICE PAID */

            document.getElementById("album-price").textContent =
                "price paid for the CD: " +
                (typeof album.price === "number"
                    ? "€" + album.price
                    : "not recorded");


            /* MARKET VALUE FOR RARE CDS */

            const marketValueElement =
                document.getElementById("album-market-value");

            if (
                album.rare === true &&
                typeof album.marketValue === "number"
            ) {

                marketValueElement.textContent =
                    "estimated market value: €" + album.marketValue;

                marketValueElement.style.display = "block";

            } else {

                marketValueElement.style.display = "none";

            }


            /* LOCATION */

            document.getElementById("album-location").textContent =
                "where: " + (album.where || "not recorded");


            /* DATE FOUND */

            document.getElementById("album-date").textContent =
                "when: " + (album.when || "not recorded");


            /* FAVOURITE SONGS */

            const songsElement =
                document.getElementById("album-songs");

            if (
                Array.isArray(album.favouriteSongs) &&
                album.favouriteSongs.length > 0
            ) {

                songsElement.textContent =
                    album.favouriteSongs
                        .map(function(song) {
                            return "- " + song;
                        })
                        .join("\n");

                songsElement.style.whiteSpace = "pre-line";

            } else {

                songsElement.textContent =
                    "not added yet";

            }


            /* FULL REVIEW */

            if (album.reviewPage) {

                const reviewLink =
                    document.createElement("a");

                reviewLink.href = album.reviewPage;
                reviewLink.className = "review-box";
                reviewLink.textContent = "full review available!";

                document.getElementById("review-container")
                    .appendChild(reviewLink);

            }

        } else {

            /* ALBUM NOT FOUND */

            document.getElementById("album-notes-text").textContent =
                "Album not found. Please return to the archive.";

        }

    </script>

</body>

</html>
