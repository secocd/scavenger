
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>scavenger</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ALBUM NAVIGATION -->

    <div class="album-nav">

        <!-- BACK BUTTON -->

        <a href="index.html" id="album-back">
            &lt;&lt;&lt; back to the pile
        </a>


        <!-- RIGHT SIDE NAVIGATION -->

        <div class="album-nav-right">

            <!-- PREVIOUS / NEXT -->

            <div
                class="album-pagination"
                id="album-pagination"
                style="display: none;"
            >

                <a id="previous-cd" href="#">
                previous
                </a>

                <a id="next-cd" href="#">
                    next
                </a>

            </div>


            <!-- SHUFFLE -->

            <a
                href="#"
                class="reshuffle-box"
                onclick="randomCD(); return false;"
            >
                shuffle
            </a>

        </div>

    </div>


    <!-- INFORMATION HEADING -->

    <h2>information</h2>


    <!-- ALBUM LAYOUT -->

    <div class="album-layout">

        <!-- LEFT SIDE -->

        <div class="album-left">

            <!-- ALBUM COVER -->

            <img
                id="album-image"
                class="album-photo"
                src=""
                alt=""
            >


            <!-- ALBUM DETAILS -->

            <div class="album-details">

                <h3 id="album-artist"></h3>

                <p id="album-title"></p>

                <p id="album-year-genre"></p>

                <p id="album-style"></p>


                <!-- RATING -->

                <div class="album-rating">

                    <strong id="album-rating"></strong>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="album-notes">

            <h3>my notes:</h3>

            <p id="album-notes-text"></p>


            <!-- FIND INFORMATION BOX -->

            <div class="album-find-info">

                <!-- PRICE PAID -->

                <div class="album-price-section">

                    <span class="album-small-label">
                        price paid
                    </span>

                    <strong id="album-price"></strong>

                </div>


                <!-- MARKET VALUE / LOCATION / DATE -->

                <div class="album-find-details">

                    <p
                        id="album-market-value"
                        style="display: none;"
                    ></p>

                    <p id="album-location"></p>

                    <p id="album-date"></p>

                </div>

            </div>


            <!-- FAVOURITE SONGS + REVIEW -->

            <div class="album-bottom-row">

                <!-- FAVOURITE SONGS -->

                <div class="album-favourites">

                    <h3>favourite songs:</h3>

                    <p id="album-songs"></p>

                </div>


                <!-- FULL REVIEW -->

                <div id="review-container"></div>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT FILES -->

    <script src="cds.js"></script>
    <script src="script.js"></script>


    <script>

        /* =====================================
           URL PARAMETERS
        ===================================== */

        const params =
            new URLSearchParams(window.location.search);

        const id = params.get("id");
        const from = params.get("from");
        const city = params.get("city");


        /* =====================================
           DYNAMIC BACK BUTTON
        ===================================== */

        const backButton =
            document.getElementById("album-back");

        if (from === "cities") {

            backButton.textContent =
                "<<< back to cities";

            backButton.href =
                "cities.html" +
                (city
                    ? "?city=" + encodeURIComponent(city)
                    : "");

        } else if (from === "rare") {

            backButton.textContent =
                "<<< back to rarest finds";

            backButton.href = "rarest-finds.html";

        } else {

            backButton.textContent =
                "<<< back to the pile";

            backButton.href = "index.html";

        }


        /* =====================================
           FIND CURRENT ALBUM
        ===================================== */

        const album = cds.find(function(cd) {
            return cd.id === id;
        });


        if (album) {

            /* PAGE TITLE */

            document.title =
                album.artist + " - " + album.album;


            /* ALBUM IMAGE */

            const albumImage =
                document.getElementById("album-image");

            albumImage.src = album.image;

            albumImage.alt =
                album.artist + " - " + album.album;


            /* ARTIST */

            document.getElementById("album-artist").textContent =
                album.artist;


            /* ALBUM TITLE */

            document.getElementById("album-title").textContent =
                album.album;


            /* YEAR AND GENRE */

            document.getElementById("album-year-genre").textContent =
                (album.year ?? "year unknown") +
                " / " + (album.genre || "");


            /* STYLE */

            document.getElementById("album-style").textContent =
                album.style || "";


            /* RATING */

            document.getElementById("album-rating").textContent =
                typeof album.rating === "number"
                    ? album.rating + "/10"
                    : "not rated";


            /* =====================================
               PERSONAL NOTES
            ===================================== */

            document.getElementById("album-notes-text").textContent =
                album.notes || "";


            /* =====================================
               PRICE PAID
            ===================================== */

            document.getElementById("album-price").textContent =
                typeof album.price === "number"
                    ? "€" + album.price
                    : "not recorded";


            /* =====================================
               MARKET VALUE
            ===================================== */

            const marketValueElement =
                document.getElementById("album-market-value");

            if (
                album.rare === true &&
                typeof album.marketValue === "number"
            ) {

                marketValueElement.textContent =
                    "estimated market value: €" +
                    album.marketValue;

                marketValueElement.style.display = "block";

            } else {

                marketValueElement.style.display = "none";

            }


            /* =====================================
               LOCATION
            ===================================== */

            document.getElementById("album-location").textContent =
                "where: " + (album.where || "not recorded");


            /* =====================================
               DATE
            ===================================== */

            document.getElementById("album-date").textContent =
                "when: " + (album.when || "not recorded");


            /* =====================================
               FAVOURITE SONGS
            ===================================== */

            const songsElement =
                document.getElementById("album-songs");

            if (
                Array.isArray(album.favouriteSongs) &&
                album.favouriteSongs.length > 0
            ) {

                songsElement.textContent =
                    album.favouriteSongs
                        .map(function(song) {
                            return "- " + song;
                        })
                        .join("\n");

            } else {

                songsElement.textContent =
                    "not added yet";

            }


            /* =====================================
               FULL REVIEW
            ===================================== */

            if (album.reviewPage) {

                const reviewLink =
                    document.createElement("a");

                reviewLink.href = album.reviewPage;

                reviewLink.className = "review-box";

                reviewLink.textContent =
                    "full review available!";

                document.getElementById("review-container")
                    .appendChild(reviewLink);

            }


            /* =====================================
               CONTEXT-AWARE PREVIOUS / NEXT
            ===================================== */

            let navigationCDs = cds;


            /* RAREST FINDS */

            if (from === "rare") {

                navigationCDs = cds.filter(function(cd) {
                    return cd.rare === true;
                });

            }


            /* CITIES */

            if (from === "cities" && city) {

                navigationCDs = cds.filter(function(cd) {

                    return (
                        typeof cd.where === "string" &&
                        cd.where.trim() === city
                    );

                });

            }


            /* FIND CURRENT POSITION */

            const currentIndex =
                navigationCDs.findIndex(function(cd) {
                    return cd.id === album.id;
                });


            /* ONLY SHOW IF MULTIPLE CDS */

            if (
                navigationCDs.length > 1 &&
                currentIndex !== -1
            ) {

                const previousIndex =
                    (currentIndex - 1 + navigationCDs.length) %
                    navigationCDs.length;

                const nextIndex =
                    (currentIndex + 1) %
                    navigationCDs.length;


                const previousAlbum =
                    navigationCDs[previousIndex];

                const nextAlbum =
                    navigationCDs[nextIndex];


                /* PRESERVE CONTEXT */

                let context = "";

                if (from === "rare") {

                    context = "&from=rare";

                } else if (from === "cities") {

                    context = "&from=cities";

                    if (city) {

                        context +=
                            "&city=" + encodeURIComponent(city);

                    }

                }


                /* PREVIOUS LINK */

                document.getElementById("previous-cd").href =
                    "album.html?id=" +
                    encodeURIComponent(previousAlbum.id) +
                    context;


                /* NEXT LINK */

                document.getElementById("next-cd").href =
                    "album.html?id=" +
                    encodeURIComponent(nextAlbum.id) +
                    context;


                /* SHOW NAVIGATION */

                document.getElementById("album-pagination")
                    .style.display = "flex";

            }

        } else {

            /* ALBUM NOT FOUND */

            document.getElementById("album-notes-text").textContent =
                "Album not found. Please return to the archive.";

        }

    </script>

</body>

</html>
