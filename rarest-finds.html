
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>rarest finds - scavenger</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- BACK TO HOMEPAGE -->

    <a href="index.html">
        &lt;&lt;&lt; back to the pile
    </a>


    <!-- DESCRIPTION -->

    <p>
        some of the harder-to-find CDs i've scavenged.
    </p>


    <!-- RAREST FINDS -->

    <h2>rarest finds</h2>


    <!-- CD COLLECTION -->

    <div
        class="collection"
        id="rare-collection"
    ></div>


    <!-- JAVASCRIPT -->

    <script src="cds.js"></script>

    <script>

        /* FIND RARE CDS */

        const rareCDs =
            cds.filter(function(cd) {

                return cd.rare === true;

            });


        /* COLLECTION ELEMENT */

        const collection =
            document.getElementById("rare-collection");


        /* DISPLAY RARE CDS */

        rareCDs.forEach(function(cd) {

            const card =
                document.createElement("div");

            card.className = "cd";


            /* ALBUM LINK */

            const link =
                document.createElement("a");

            link.href =
                "album.html?id=" +
                encodeURIComponent(cd.id) +
                "&from=rare";


            /* ALBUM IMAGE */

            const image =
                document.createElement("img");

            image.src = cd.image;

            image.alt =
                cd.artist + " - " + cd.album;

            link.appendChild(image);


            /* ARTIST */

            const artist =
                document.createElement("h3");

            artist.textContent = cd.artist;


            /* ALBUM */

            const album =
                document.createElement("p");

            album.textContent = cd.album;


            /* ADD CARD */

            card.appendChild(link);
            card.appendChild(artist);
            card.appendChild(album);

            collection.appendChild(card);

        });


        /* NO RARE CDS */

        if (rareCDs.length === 0) {

            const message =
                document.createElement("p");

            message.textContent =
                "no rare CDs added yet";

            collection.appendChild(message);

        }

    </script>

</body>

</html>
