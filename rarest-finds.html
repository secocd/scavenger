<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>scavenger - rarest finds</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- PAGE HEADER -->

    <a href="index.html"><<< back to the pile</a>

    <h1>my rarest finds</h1>

    <p>
        some of the harder-to-find CDs i've scavenged.
    </p>


    <h2>rarest finds</h2>


    <!-- RARE CDS ARE GENERATED AUTOMATICALLY -->

    <div
        class="collection"
        id="rare-collection"
    ></div>


    <!-- JAVASCRIPT -->

    <script src="cds.js"></script>


    <script>

        const rareCollection =
            document.getElementById("rare-collection");


        const rareCDs =
            cds.filter(function(cd) {

                return cd.rare === true;

            });


        rareCDs.forEach(function(cd) {

            const card =
                document.createElement("div");


            card.className = "cd";


            card.innerHTML = `
                <a href="album.html?id=${cd.id}">

                    <img
                        src="${cd.image}"
                        alt="${cd.artist} - ${cd.album}"
                    >

                </a>

                <h3>${cd.artist}</h3>

                <p>${cd.album}</p>
            `;


            rareCollection.appendChild(card);

        });


        if (rareCDs.length === 0) {

            rareCollection.innerHTML =
                "<p>no rare finds added yet.</p>";

        }

    </script>


</body>

</html>
