
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>scavenger</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- WEBSITE TITLE -->

    <div class="home-header">

        <h1>scavenger</h1>

    </div>


    <!-- ARCHIVE TOOLBAR -->

    <div class="archive-toolbar">


        <!-- ARCHIVE COUNT -->

        <p class="collection-count">

            <span id="collection-count">0</span>
            CDs from my collection archived so far

        </p>


        <!-- NAVIGATION -->

        <div class="archive-menu">

            <a
                href="#"
                class="toolbar-box"
                onclick="randomCD(); return false;"
            >
                random CD
            </a>

            <a
                href="rarest-finds.html"
                class="toolbar-box"
            >
                rarest finds
            </a>

            <a
                href="cities.html"
                class="toolbar-box"
            >
                cities
            </a>

            <a
                href="stats.html"
                class="toolbar-box"
            >
                stats
            </a>

            <a
                href="about.html"
                class="toolbar-box"
            >
                about
            </a>

        </div>


        <!-- SCAVENGER VULTURE LOGO -->

        <div class="archive-logo">

            <img
                src="images/logo.png"
                alt="Scavenger vulture logo"
            >

        </div>


        <!-- SEARCH, SORT AND FILTERS -->

        <div class="archive-controls">


            <!-- FIRST ROW: SEARCH + SORT -->

            <div class="search-sort">

                <input
                    type="text"
                    id="archive-search"
                    class="archive-search"
                    placeholder="search artist or album..."
                >

                <select
                    id="archive-sort"
                    class="archive-sort"
                >
                    <option value="original">original order</option>
                    <option value="artist-az">artist A-Z</option>
                    <option value="artist-za">artist Z-A</option>
                    <option value="year-new">newest album</option>
                    <option value="year-old">oldest album</option>
                    <option value="rating-high">highest rated</option>
                    <option value="price-low">lowest price</option>
                </select>

            </div>


            <!-- SECOND ROW: GENRE + STYLE -->

            <div class="filter-row">

                <select
                    id="archive-genre"
                    class="archive-filter"
                >
                    <option value="all">all genres</option>
                </select>

                <select
                    id="archive-style"
                    class="archive-filter"
                >
                    <option value="all">all styles</option>
                </select>

            </div>


        </div> <!-- END ARCHIVE CONTROLS -->


    </div> <!-- END ARCHIVE TOOLBAR -->


    <!-- ARCHIVE HEADING -->

    <h2>archive</h2>


    <!-- CD COLLECTION -->

    <div
        class="collection"
        id="collection"
    ></div>


    <!-- JAVASCRIPT -->

    <script src="cds.js"></script>
    <script src="script.js"></script>


</body>

</html>
